name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    # Code scanning / CodeQL upload needs GitHub Advanced Security, which is
    # free on PUBLIC repos but unavailable on private free-plan repos. Skip
    # (don't fail) while private; this activates automatically once the repo
    # is made public.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
