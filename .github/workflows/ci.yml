name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: s0m3p4ssw0rd
          MYSQL_DATABASE: swachalit
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ps0m3p4ssw0rd"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key
      MYSQL_SERVER: 127.0.0.1
      MYSQL_PORT: 3307
      MYSQL_DATABASE: swachalit
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: s0m3p4ssw0rd
      REDIS_URL: redis://127.0.0.1:6380/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # PyMySQL shim (config/__init__.py) means mysqlclient/system libs are
        # NOT required — install the app deps plus dev/test extras.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        # Clean env (workflow env above only sets DB/secret) so no showcase
        # settings can leak in; see docs/DEVELOPMENT.md.
        run: python -m pytest -q

      - name: Django deploy check (prod settings smoke)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: example.com
          ROOT_DOMAIN: example.com
        run: python manage.py check --deploy || true
