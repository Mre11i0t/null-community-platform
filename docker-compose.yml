services:
  db:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: s0m3p4ssw0rd
      MYSQL_DATABASE: swachalit
    ports:
      # Bind to loopback only — the DB must not be reachable from the LAN.
      # The app connects via 127.0.0.1:3307 (host networking), so nothing
      # legitimate breaks; only off-host access is removed.
      - "127.0.0.1:3307:3306"
    volumes:
      - ncp-mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  ncp-mysql:
