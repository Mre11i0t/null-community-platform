{% extends "base.html" %}
{% block page_title %}Add achievement — null Community{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6 col-md-offset-3">
    <div class="page-header"><h1>Add an achievement</h1></div>
    <p class="text-muted">Shown on your public profile as self-reported. Each needs a verifiable reference link.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Type</label>
        <select name="achievement_type" class="form-control">
          {% for value, label in types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>What is it? *</label>
        <input type="text" name="info" class="form-control" maxlength="255" placeholder="e.g. CVE-2026-1234 in FooBar Router" required>
      </div>
      <div class="form-group">
        <label>Reference link *</label>
        <input type="url" name="reference" class="form-control" maxlength="255" placeholder="https://…" required>
      </div>
      <button type="submit" class="btn btn-primary">Add to my profile</button>
    </form>
  </div>
</div>
{% endblock %}
