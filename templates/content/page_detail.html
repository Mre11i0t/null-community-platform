{% extends "base.html" %}
{% load core_extras %}
{% block page_title %}{{ page.title }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-12">
    <div class="page-header"><h1>{{ page.title }}</h1></div>
  </div>
</div>
<div class="row">
  <div class="col-md-12">{{ page.content|markdown_html }}</div>
</div>
<div class="row" style="padding-top:1em;">
  <div class="col-md-12">
    <span class="pull-right"><small>Last edited: {{ page.updated_at }}</small></span>
  </div>
</div>
{% endblock %}
