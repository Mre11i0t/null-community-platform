{% extends "base.html" %}
{% block page_title %}Feedback — {{ event.name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6 col-md-offset-3">
    <div class="page-header"><h1>How was it? <small>{{ event.name }}</small></h1></div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group text-center">
        {% for i in "12345" %}
          <label class="radio-inline" style="font-size:1.4em">
            <input type="radio" name="rating" value="{{ i }}"
              {% if existing and existing.rating == i|add:0 %}checked{% endif %} required> {{ i }}★
          </label>
        {% endfor %}
      </div>
      <div class="form-group">
        <label>Anything the organizers should know?</label>
        <textarea name="comment" class="form-control" rows="3">{{ existing.comment|default:"" }}</textarea>
      </div>
      <button type="submit" class="btn btn-lg btn-primary btn-block">{% if existing %}Update{% else %}Submit{% endif %} feedback</button>
    </form>
  </div>
</div>
{% endblock %}
