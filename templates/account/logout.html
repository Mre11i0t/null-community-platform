{% extends "base.html" %}
{% block page_title %}Sign Out - null Community{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-12">
    <div class="page-header"><h2>Sign Out</h2></div>
    <p>Are you sure you want to sign out?</p>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="fa fa-sign-out"></i> Sign Out</button>
    </form>
  </div>
</div>
{% endblock %}
