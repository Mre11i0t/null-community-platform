{% extends "base.html" %}
{% load static %}
{% block page_title %}Scanner — {{ event.name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-12">
    <div class="page-header"><h1>Scanner <small>{{ event.name }}</small></h1></div>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div id="qr-reader" style="max-width:400px"></div>
  </div>
  <div class="col-md-6">
    <form id="manual-form">
      <div class="form-group">
        <label for="manual-code">Manual code entry (works with USB barcode scanners)</label>
        <input type="text" class="form-control" id="manual-code" autofocus autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary">Check in</button>
    </form>
    <hr>
    <div id="scan-result"></div>
  </div>
</div>

<script src="{% static 'vendor/html5-qrcode.min.js' %}"></script>
<script>
  var resultBox = document.getElementById("scan-result");
  var busy = false;

  function mark(code) {
    if (busy || !code) return;
    busy = true;
    var body = new FormData();
    body.append("code", code);
    body.append("csrfmiddlewaretoken", "{{ csrf_token }}");
    fetch("{% url 'leads:check_in_mark' event.pk %}", { method: "POST", body: body })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          resultBox.innerHTML = '<div class="alert alert-' + (data.already_checked_in ? "warning" : "success") + '">' +
            '<strong>' + data.name + '</strong> ' +
            (data.already_checked_in ? "was already checked in." : "checked in.") + '</div>';
        } else {
          resultBox.innerHTML = '<div class="alert alert-danger">' + data.error + '</div>';
        }
      })
      .catch(function () {
        resultBox.innerHTML = '<div class="alert alert-danger">Network error — try again.</div>';
      })
      .finally(function () { setTimeout(function () { busy = false; }, 1200); });
  }

  document.getElementById("manual-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("manual-code");
    mark(input.value.trim());
    input.value = "";
    input.focus();
  });

  if (typeof Html5QrcodeScanner !== "undefined") {
    new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 220 }, false)
      .render(function (decoded) { mark(decoded); }, function () {});
  }
</script>
{% endblock %}
